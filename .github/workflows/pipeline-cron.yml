name: Swarm Pipeline Automated Scheduler

on:
  schedule:
    # Runs hourly automatically for free via GitHub Actions to exhaust available swarm node quotas
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger directly from the GitHub Actions tab

jobs:
  run-pipeline:
    name: Trigger Swarm Ingestion & Uploads
    runs-on: ubuntu-latest
    steps:
      - name: Send Execution Request to Vercel Pipeline
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Use APP_URL secret if provided, or default to production deployed URL
          TARGET_URL="${APP_URL:-https://asian-dailymotion-api.vercel.app}"
          BASE_URL="${TARGET_URL%/}"
          
          echo "🚀 Invoking automated swarm pipeline at $BASE_URL/api/cron/process..."
          
          HTTP_CODE=$(curl -s -S -o /dev/null -w "%{http_code}" -X GET "$BASE_URL/api/cron/process?key=${CRON_SECRET:-}&sync=1" \
            -H "Authorization: Bearer ${CRON_SECRET:-}" \
            --max-time 300 || echo "000")
            
          echo "Pipeline response HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Pipeline successfully executed."
          else
            echo "⚠️ Pipeline returned HTTP $HTTP_CODE (non-blocking fallback)."
          fi
