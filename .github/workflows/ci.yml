name: Production CI & Quality Guard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Test & Build Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run CI Validation Tests
        run: npm test

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          TURSO_DATABASE_URL: libsql://dummy-ci-db.turso.io
          TURSO_AUTH_TOKEN: dummy_ci_token
          TMDB_API_KEY: dummy_tmdb_key
          ADMIN_SECRET: ci_test_admin_secret_1234
          CRON_SECRET: ci_test_cron_secret_1234
